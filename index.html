<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/crests/league.webp" />
    <link rel="preload" as="image" href="/crests/league.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ฟุตซอลลีก" />
    <meta name="description" content="ฟุตซอลลีก สายใยสัมพันธ์ อบต.อำเภอบาเจาะ" />
    <script>
      try {
        // Default = dark (sports app standard). Only switch if user chose light before.
        var t = localStorage.getItem('bacho-league-theme')
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#f2f3f5')
        } else {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ฟุตซอลลีก</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
